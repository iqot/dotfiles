name: Merge main into osx
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
jobs:
  merge-main-into-osx:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'bot/fast-inputs-update')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pushing a merge that carries workflow file changes needs the workflows permission.
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v7
        with:
          ref: osx
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # A conflicting merge fails the job and leaves osx untouched.
      - name: Merge main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898182+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          git push origin osx
