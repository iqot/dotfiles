name: Upgrade dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * FRI"
jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # PRs opened with GITHUB_TOKEN don't trigger CI without manual approval.
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.2
      - name: Update dependencies
        run: nix run '.#update'
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/routine-update
          delete-branch: true
          labels: dependencies
          title: "chore(deps): routine update"
          commit-message: "chore(deps): routine update"
          body: |
            - Update submodules
            - Update flakes
            - Update packages
